<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="min-h-screen flex items-center justify-center py-10 px-4">
<div class="bg-white shadow-xl rounded-xl w-full max-w-3xl p-8">
<h1 class="text-3xl font-bold text-center text-blue-600">
Create Account
</h1>
<p class="text-center text-gray-500 mt-2">
Fill in your details
</p>
<form action="verify.html" class="mt-8 grid md:grid-cols-2 gap-5">
<div>
<label class="font-medium">First Name</label>
<input type="text" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Last Name</label>
<input type="text" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Username</label>
<input type="text" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Email</label>
<input type="email" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Phone Number</label>
<input type="tel" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Date of Birth</label>
<input type="date" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Gender</label>
<select
class="w-full mt-2 border rounded-lg px-4 py-3">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>
<div>
<label class="font-medium">Country</label>
<input type="text"
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div class="md:col-span-2">
<label class="font-medium">Address</label>
<textarea rows="3"
class="w-full mt-2 border rounded-lg px-4 py-3"></textarea>
</div>
<div>
<label class="font-medium">City</label>
<input type="text"
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">State</label>
<input type="text"
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Zip Code</label>
<input type="text"
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Password</label>
<input type="password" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div>
<label class="font-medium">Confirm Password</label>
<input type="password" required
class="w-full mt-2 border rounded-lg px-4 py-3">
</div>
<div class="md:col-span-2">
<label class="flex items-center gap-2">
<input type="checkbox" required>
<span>
I agree to the Terms & Conditions
</span>
</label>
</div>
<div class="md:col-span-2">
<button
type="submit"
class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
Create Account
</button>
</div>
<div class="md:col-span-2 text-center">
Already have an account?
<a href="signin.html"
class="text-blue-600 font-semibold">
Sign In
</a>
</div>
</form>
</div>
</div>
</body>
</html>
